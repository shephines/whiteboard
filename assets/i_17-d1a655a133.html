<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inclined Plane — Energy Explorer</title>
<style>
  :root{--ink:#22315B;--soft:#5A6685;--orange:#FF6B35;--green:#1FA06B;--line:#E4E8F2;--bg:#FFFDF9;--panel:#F5F7FC}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column}
  #stage{flex:1;position:relative}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  #hud{position:absolute;left:12px;top:12px;background:rgba(255,253,249,.92);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:176px}
  #hud h3{font-family:'Baloo 2','Inter',sans-serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
  .bar{height:14px;border-radius:7px;background:var(--panel);overflow:hidden;margin:3px 0 9px}
  .fill{height:100%;width:0;transition:width .08s linear}
  .pe{background:var(--orange)} .ke{background:var(--green)}
  .lab{font-size:11px;font-weight:700;display:flex;justify-content:space-between}
  #drophint{position:absolute;right:12px;top:12px;background:rgba(34,49,91,.92);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:7px 11px;max-width:150px;line-height:1.4}
  #ctrl{padding:10px 14px;background:#fff;border-top:1.5px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #ctrl label{font-size:12px;font-weight:700;color:var(--soft)}
  input[type=range]{accent-color:var(--orange);flex:1;min-width:110px}
  button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--ink);color:#fff}
  button.sec{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
  #angTag{font-weight:800;color:var(--orange);font-size:14px;min-width:46px;text-align:right}
</style></head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas>
    <div id="hud">
      <h3>Energy of the ball</h3>
      <div class="lab"><span>Potential</span><span id="pev">100%</span></div><div class="bar"><div class="fill pe" id="peb"></div></div>
      <div class="lab"><span>Kinetic</span><span id="kev">0%</span></div><div class="bar"><div class="fill ke" id="keb"></div></div>
    </div>
    <div id="drophint">Drag up / down to tilt the ramp</div>
  </div>
  <div id="ctrl">
    <label>Ramp angle</label>
    <input type="range" id="ang" min="12" max="42" value="26">
    <span id="angTag">26°</span>
    <button id="run">▶ Release ball</button>
    <button class="sec" id="reset">Reset</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const C=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:C,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xFFFDF9);
const cam=new THREE.PerspectiveCamera(42,1,0.1,100); cam.position.set(0,3.4,9.2); cam.lookAt(0,1.2,0);
scene.add(new THREE.AmbientLight(0xffffff,.85));
const dl=new THREE.DirectionalLight(0xffffff,.65); dl.position.set(4,8,6); scene.add(dl);
const ground=new THREE.Mesh(new THREE.BoxGeometry(14,.4,6),new THREE.MeshLambertMaterial({color:0xE4E8F2}));
ground.position.y=-.2; scene.add(ground);
const rampLen=7, rampW=2.4;
const ramp=new THREE.Mesh(new THREE.BoxGeometry(rampLen,.3,rampW),new THREE.MeshLambertMaterial({color:0x22315B}));
const pivot=new THREE.Group(); pivot.position.set(-3.4,0,0); scene.add(pivot);
ramp.position.x=rampLen/2; pivot.add(ramp);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.42,24,18),new THREE.MeshStandardMaterial({color:0xFF6B35,roughness:.4}));
scene.add(ball);
let angleDeg=26, t=0, running=false;
function setAngle(d){ angleDeg=Math.max(12,Math.min(42,d)); pivot.rotation.z=angleDeg*Math.PI/180; placeBallTop();
  document.getElementById('ang').value=Math.round(angleDeg); document.getElementById('angTag').textContent=Math.round(angleDeg)+'°'; }
function placeBallTop(){ const a=angleDeg*Math.PI/180;
  ball.position.set(-3.4+Math.cos(a)*(rampLen-.6), Math.sin(a)*(rampLen-.6)+.42, 0); }
const peb=document.getElementById('peb'),keb=document.getElementById('keb'),pev=document.getElementById('pev'),kev=document.getElementById('kev');
function energy(frac){ const pe=Math.round((1-frac)*100), ke=Math.round(frac*100);
  peb.style.width=pe+'%'; keb.style.width=ke+'%'; pev.textContent=pe+'%'; kev.textContent=ke+'%'; }
setAngle(26); energy(0);
let startTop=null,endBot=null,dur=0;
function release(){ if(running)return; const a=angleDeg*Math.PI/180;
  startTop=new THREE.Vector3(-3.4+Math.cos(a)*(rampLen-.6),Math.sin(a)*(rampLen-.6)+.42,0);
  endBot=new THREE.Vector3(-3.4+Math.cos(a)*.6,Math.sin(a)*.6+.42,0);
  dur=1.05+(42-angleDeg)/30; t=0; running=true; }
function resetAll(){ running=false; t=0; placeBallTop(); energy(0); }
document.getElementById('run').onclick=release;
document.getElementById('reset').onclick=resetAll;
document.getElementById('ang').oninput=e=>{ if(!running)setAngle(+e.target.value); };
// DRAG to tilt the ramp
let dragging=false,dy0=0,a0=0;
C.addEventListener('pointerdown',e=>{ if(running)return; dragging=true; dy0=e.clientY; a0=angleDeg; C.classList.add('drag'); try{C.setPointerCapture(e.pointerId);}catch(_){}});
C.addEventListener('pointermove',e=>{ if(!dragging)return; setAngle(a0+(dy0-e.clientY)*0.2); });
function endDrag(){ dragging=false; C.classList.remove('drag'); }
C.addEventListener('pointerup',endDrag); C.addEventListener('pointercancel',endDrag); C.addEventListener('pointerleave',endDrag);
let last=performance.now();
function loop(now){ const dt=(now-last)/1000; last=now;
  if(running){ t+=dt/dur; let e=Math.min(t,1); e=e*e; if(e>=1){e=1;running=false;}
    ball.position.lerpVectors(startTop,endBot,e); energy(e); }
  renderer.render(scene,cam); requestAnimationFrame(loop); }
function resize(){const w=C.clientWidth,h=C.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(C); resize(); requestAnimationFrame(loop);

/* ===== live-sync contract (Bhanzu Lesson Studio classroom) ===== */
let _bcast=true;
function getState(){ var a=+angleDeg; if(!isFinite(a))a=26;
  return { angle:Math.round(a), phase: running?'rolling':(t>0?'done':'idle') }; }
function setState(s){ if(!s)return; _bcast=false;
  try{ if(s.phase==='idle' && (running||t>0)) resetAll();
    if(typeof s.angle==='number'&&isFinite(s.angle)&&!running) setAngle(s.angle);
    if(s.phase==='rolling' && !running && t===0) release();
  }finally{ _bcast=true; } }
window.addEventListener('message',function(e){ var d=e.data||{};
  if(d.type==='getState'){ try{parent.postMessage({type:'state',data:getState()},'*');}catch(_){} }
  else if(d.type==='setState'){ setState(d.data); } });
(function(){ if(window.__liveSyncEmit)return; var _t=0,_p=null;
  function _send(){ try{ if(typeof getState!=='function')return; parent.postMessage({type:'state',data:getState()},'*'); }catch(_){} }
  window.__liveSyncEmit=function(){ var n=Date.now(); if(n-_t>110){_t=n;_send();} else {clearTimeout(_p);_p=setTimeout(function(){_t=Date.now();_send();},110);} };
  ['pointerdown','pointermove','pointerup','click','input','change','wheel','keydown','keyup','touchmove','touchend']
    .forEach(function(ev){ document.addEventListener(ev,function(){setTimeout(window.__liveSyncEmit,0);},true); });
})();
</script></body></html>
