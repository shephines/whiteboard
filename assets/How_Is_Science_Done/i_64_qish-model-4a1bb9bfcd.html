<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heat Given Away</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fdf8f0;
    overflow: hidden;
  }
  #restart-btn {
    position: fixed;
    top: 14px; right: 18px;
    z-index: 60;
    background: #ffffff;
    border: 3px solid #4fa3d1;
    color: #1f6a94;
    font-size: 22px;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
  }
  #layout {
    display: flex;
    height: 100%;
  }
  #left-col {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }
  .mat-card {
    background: #fff;
    border: 2px solid #4fa3d1;
    border-radius: 14px;
    padding: 22px;
    text-align: center;
  }
  .mat-name { font-size: 21px; font-weight: 800; margin-bottom: 10px; }
  #al .mat-name { color: #46586a; }
  #pl .mat-name { color: #2c6e63; }
  .mat-temp { font-size: 27px; font-weight: 700; color: #234; margin-bottom: 16px; }
  .btn-row { display: flex; gap: 8px; }
  .mat-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
  }
  .mat-btn-up { opacity: 0.6; }
  #al .mat-btn { background: #6f8296; }
  #pl .mat-btn { background: #3f7f74; }

  #chart-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  #chart-svg { width: 98%; height: 98%; }
</style>
</head>
<body>

<button id="restart-btn">&#8635; Restart</button>

<div id="layout">
  <div id="left-col">
    <div class="mat-card" id="al">
      <div class="mat-name">Aluminium</div>
      <div class="mat-temp" id="temp-al">165.2&deg;C</div>
      <div class="btn-row">
        <button class="mat-btn" id="btn-al-down">&minus;0.5&deg;C</button>
        <button class="mat-btn mat-btn-up" id="btn-al-up">+0.5&deg;C</button>
      </div>
    </div>
    <div class="mat-card" id="pl">
      <div class="mat-name">Plastic</div>
      <div class="mat-temp" id="temp-pl">165.2&deg;C</div>
      <div class="btn-row">
        <button class="mat-btn" id="btn-pl-down">&minus;0.5&deg;C</button>
        <button class="mat-btn mat-btn-up" id="btn-pl-up">+0.5&deg;C</button>
      </div>
    </div>
  </div>

  <div id="chart-wrap">
    <svg id="chart-svg" viewBox="0 0 700 500"></svg>
  </div>
</div>

<script>
(function(){
  // Real block heat capacities (same volume, real densities/specific heats)
  var C_AL = 775;   // J per degree C
  var C_PL = 578;   // J per degree C
  var T0 = 165.2;
  var STEP = 0.5;
  var MAX_DROP = 15;
  var MAX_HEAT = MAX_DROP * C_AL;

  var W = 700, H = 500;
  var PAD_L = 90, PAD_R = 30, PAD_T = 20, PAD_B = 75;

  function xToPx(d){ return PAD_L + (d / MAX_DROP) * (W - PAD_L - PAD_R); }
  function yToPx(q){ return PAD_T + (q / MAX_HEAT) * (H - PAD_T - PAD_B); }

  var svg = document.getElementById('chart-svg');
  var svgns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var e = document.createElementNS(svgns, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function drawAxes(){
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    svg.appendChild(el('line', { x1: PAD_L, y1: H-PAD_B, x2: W-PAD_R, y2: H-PAD_B, stroke:'#345', 'stroke-width':2 }));
    svg.appendChild(el('line', { x1: PAD_L, y1: PAD_T, x2: PAD_L, y2: H-PAD_B, stroke:'#345', 'stroke-width':2 }));

    var xl = el('text', { x: W/2, y: H-12, 'text-anchor':'middle', 'font-size':14, fill:'#345' });
    xl.textContent = 'Temp drop (\u00B0C)';
    svg.appendChild(xl);

    var yl = el('text', { x: 20, y: H/2, 'text-anchor':'middle', 'font-size':14, fill:'#345', transform:'rotate(-90 20 '+(H/2)+')' });
    yl.textContent = 'Heat given away (J)';
    svg.appendChild(yl);

    for (var d = 0; d <= MAX_DROP; d += 0.5){
      var tickH = (d % 1 === 0) ? 8 : 4;
      svg.appendChild(el('line', { x1:xToPx(d), y1:H-PAD_B, x2:xToPx(d), y2:H-PAD_B+tickH, stroke:'#345', 'stroke-width':1 }));
      if (d % 1 === 0){
        var tx = el('text', { x:xToPx(d), y:H-PAD_B+22, 'text-anchor':'middle', 'font-size':11, fill:'#345' });
        tx.textContent = d;
        svg.appendChild(tx);
      }
    }
  }

  function makePoint(color){
    var trace = el('line', { stroke: color, 'stroke-width':3 });
    var hLine = el('line', { stroke: color, 'stroke-width':1.5, 'stroke-dasharray':'6,5' });
    var vLine = el('line', { stroke: color, 'stroke-width':1.5, 'stroke-dasharray':'6,5' });
    var label = el('text', { 'font-size':13, 'font-weight':700, fill: color, 'text-anchor':'end' });
    var xLabel = el('text', { 'font-size':13, 'font-weight':700, fill: color, 'text-anchor':'middle' });
    var dot = el('circle', { r:7, fill: color, stroke:'#fff', 'stroke-width':2 });
    svg.appendChild(trace);
    svg.appendChild(hLine);
    svg.appendChild(vLine);
    svg.appendChild(label);
    svg.appendChild(xLabel);
    svg.appendChild(dot);
    return { trace: trace, hLine: hLine, vLine: vLine, label: label, xLabel: xLabel, dot: dot };
  }

  var pAl, pPl;
  var dropAl = 0, dropPl = 0;

  function place(p, drop, cap){
    var heat = drop * cap;
    var px = xToPx(drop), py = yToPx(heat);
    var originX = xToPx(0), originY = yToPx(0);
    p.trace.setAttribute('x1', originX); p.trace.setAttribute('y1', originY);
    p.trace.setAttribute('x2', px); p.trace.setAttribute('y2', py);
    p.hLine.setAttribute('x1', PAD_L); p.hLine.setAttribute('y1', py);
    p.hLine.setAttribute('x2', px); p.hLine.setAttribute('y2', py);
    p.vLine.setAttribute('x1', px); p.vLine.setAttribute('y1', py);
    p.vLine.setAttribute('x2', px); p.vLine.setAttribute('y2', H - PAD_B);
    p.label.setAttribute('x', PAD_L - 8);
    p.label.setAttribute('y', py - 6);
    p.label.textContent = Math.round(heat);
    p.xLabel.setAttribute('x', px);
    p.xLabel.setAttribute('y', H - PAD_B + 38);
    p.xLabel.textContent = drop.toFixed(1);
    p.dot.setAttribute('cx', px);
    p.dot.setAttribute('cy', py);
  }

  function refresh(){
    document.getElementById('temp-al').textContent = (T0 - dropAl).toFixed(1) + '\u00B0C';
    document.getElementById('temp-pl').textContent = (T0 - dropPl).toFixed(1) + '\u00B0C';
    place(pAl, dropAl, C_AL);
    place(pPl, dropPl, C_PL);
  }

  function init(){
    dropAl = 0; dropPl = 0;
    drawAxes();
    pAl = makePoint('#6f8296');
    pPl = makePoint('#3f7f74');
    refresh();
  }

  document.getElementById('btn-al-down').addEventListener('click', function(){
    if (dropAl < MAX_DROP){ dropAl += STEP; refresh(); }
  });
  document.getElementById('btn-al-up').addEventListener('click', function(){
    if (dropAl > 0){ dropAl -= STEP; refresh(); }
  });
  document.getElementById('btn-pl-down').addEventListener('click', function(){
    if (dropPl < MAX_DROP){ dropPl += STEP; refresh(); }
  });
  document.getElementById('btn-pl-up').addEventListener('click', function(){
    if (dropPl > 0){ dropPl -= STEP; refresh(); }
  });
  document.getElementById('restart-btn').addEventListener('click', init);

  init();

  /* === Bhanzu Studio Sync Contract === */
  function getState(){
    return { dropAl: dropAl, dropPl: dropPl };
  }
  function setState(d){
    if (!d) return;
    if (d.dropAl !== undefined) dropAl = d.dropAl;
    if (d.dropPl !== undefined) dropPl = d.dropPl;
    refresh();
  }
  window.addEventListener("message", function(e){
    var d = e.data || {};
    if (d.type === "getState") parent.postMessage({type:"state", data:getState()}, "*");
    if (d.type === "setState") setState(d.data);
  });
})();
</script>
</body>
</html>
