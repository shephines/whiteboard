<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ShapeShift</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background-color:#fef4e4;
  background-image:radial-gradient(#d9cdb4 1.2px,transparent 1.2px);
  background-size:22px 22px;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
}
#w{width:100%;max-width:540px;display:flex;flex-direction:column;gap:16px}
#qbox{background:#fff;border:3px solid #1a1a2e;border-radius:16px;padding:16px 20px;box-shadow:5px 5px 0 #1a1a2e}
#q{font-size:22px;font-weight:800;color:#1a1a2e;line-height:1.3;letter-spacing:-.2px}
#gbox{background:#fff;border:3px solid #1a1a2e;border-radius:16px;overflow:hidden;box-shadow:5px 5px 0 #1a1a2e}
svg{display:block;width:100%;height:auto;touch-action:none}
#btnrow{display:flex;gap:10px;align-items:stretch}
#sub{flex:1;padding:15px;border-radius:14px;border:3px solid #1a1a2e;background:#2bba6e;color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:5px 5px 0 #1a1a2e;transition:transform .08s,box-shadow .08s;letter-spacing:.4px}
#sub:hover{background:#24a660}
#sub:active{transform:translate(5px,5px);box-shadow:none}
#undoBtn{padding:15px 18px;border-radius:14px;border:3px solid #1a1a2e;background:#f8f5ef;color:#1a1a2e;font-size:16px;font-weight:800;cursor:pointer;box-shadow:5px 5px 0 #1a1a2e;transition:transform .08s,box-shadow .08s;white-space:nowrap}
#undoBtn:hover:not(:disabled){background:#f0ede6}
#undoBtn:active:not(:disabled){transform:translate(5px,5px);box-shadow:none}
#undoBtn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:2px 2px 0 #1a1a2e}
#res{display:none;padding:15px 20px;border-radius:14px;border:3px solid #1a1a2e;font-size:14px;font-weight:700;line-height:1.7;white-space:pre-wrap}
.ok{background:#d1fae5;box-shadow:5px 5px 0 #1a1a2e;color:#065f46;font-size:19px;text-align:center}
.no{background:#ffe4ea;box-shadow:5px 5px 0 #1a1a2e;color:#9b1c1c}
@keyframes ptPulse{0%,100%{opacity:.25;r:15}50%{opacity:.55;r:18}}
.pt-glow{pointer-events:none}
.pt-glow.active{animation:ptPulse .65s ease-in-out infinite}
</style>
</head>

<div id="w">
  <div id="qbox"><p id="q"></p></div>
  <div id="gbox"><svg id="sv"></svg></div>
  <div id="btnrow"><button id="undoBtn" disabled>↩ Undo</button><button id="sub">Submit ✓</button></div>
  <div id="res"></div>
</div>
<script>
function latexToJS(latex) {
  function parseBrace(s, start) {
    var i = start;
    while (i < s.length && s[i] === ' ') i++;
    if (i >= s.length) return ['', i];
    if (s[i] === '{') {
      var depth = 0, j = i;
      while (j < s.length) {
        if (s[j] === '{') depth++;
        else if (s[j] === '}') { if (--depth === 0) return [s.slice(i+1,j), j+1]; }
        j++;
      }
      return [s.slice(i+1), s.length];
    }
    var m = s.slice(i).match(/^[a-zA-Z_]\w*|^\d+\.?\d*|^./);
    if (!m) return ['', i+1];
    return [m[0], i + m[0].length];
  }
  function expand2(s, cmd, fn) {
    while (s.indexOf('\\' + cmd) !== -1) {
      var idx = s.indexOf('\\' + cmd);
      var charAfter = s[idx + cmd.length + 1];
      if (charAfter && /[a-zA-Z]/.test(charAfter)) break;
      var rest = s.slice(idx + cmd.length + 1);
      var r1 = parseBrace(rest, 0);
      var r2 = parseBrace(rest, r1[1]);
      s = s.slice(0, idx) + fn(r1[0], r2[0]) + rest.slice(r2[1]);
    }
    return s;
  }

  var s = latex.trim();
  s = s.replace(/\\(left|right|big|Big|bigg|Bigg|displaystyle|textstyle|scriptstyle)\b/g, '');
  s = s.replace(/\\text\{[^}]*\}/g, '');
  s = s.replace(/\\[,;!: ]/g, ' ');
  s = s.replace(/\\pi\b/g, '(Math.PI)');
  s = s.replace(/\\infty\b/g, 'Infinity');

  var fns = [
    ['arcsin','Math.asin'], ['arccos','Math.acos'], ['arctan','Math.atan'],
    ['arsinh','Math.asinh'],['arcosh','Math.acosh'],['artanh','Math.atanh'],
    ['sinh','Math.sinh'],   ['cosh','Math.cosh'],   ['tanh','Math.tanh'],
    ['sin','Math.sin'],     ['cos','Math.cos'],     ['tan','Math.tan'],
    ['ln','Math.log'],      ['log','Math.log10'],   ['exp','Math.exp'],
    ['abs','Math.abs'],     ['min','Math.min'],     ['max','Math.max'],
    ['floor','Math.floor'], ['ceil','Math.ceil'],   ['round','Math.round'],
  ];
  fns.forEach(function(p) { s = s.replace(new RegExp('\\\\' + p[0] + '\\b', 'g'), p[1]); });

  s = s.replace(/\\cdot\s*/g,'*').replace(/\\times\s*/g,'*').replace(/\\div\s*/g,'/').replace(/\\mod\b/g,'%');
  s = s.replace(/_\{(\w+)\}/g, '_$1');
  s = s.replace(/\^\{([^}]+)\}/g, '**($1)');
  s = s.replace(/\^(-?\d+(?:\.\d+)?)/g, '**($1)');
  s = s.replace(/\^([a-zA-Z_]\w*)/g, '**($1)');

  while (s.indexOf('\\sqrt') !== -1) {
    var si = s.indexOf('\\sqrt'), rest = s.slice(si+5), tr = rest.replace(/^\s+/,'');
    if (tr[0] === '[') {
      var ni = rest.indexOf('['), ne = rest.indexOf(']');
      var rx = parseBrace(rest, ne+1);
      s = s.slice(0,si)+'Math.pow(('+rx[0]+'),(1/('+rest.slice(ni+1,ne)+')))'+rest.slice(rx[1]);
    } else {
      var rx2 = parseBrace(rest, 0);
      s = s.slice(0,si)+'Math.sqrt('+rx2[0]+')'+rest.slice(rx2[1]);
    }
  }

  s = expand2(s, 'frac', function(a, b) { return '(('+a+')/('+b+'))'; });

  var safety = 0;
  while (/\|[^|]+\|/.test(s) && safety++ < 20) s = s.replace(/\|([^|]+)\|/g, 'Math.abs($1)');

  s = s.replace(/\{/g,'(').replace(/\}/g,')');

  // Math.fn with no parens: Math.sin x_1 → Math.sin(x_1)
  s = s.replace(/(Math\.\w+)(?!\s*\()(\s+)([a-zA-Z_]\w*)/g, '$1($3)');
  s = s.replace(/(Math\.\w+)(?!\s*\()(\s+)(\d+\.?\d*)/g, '$1($3)');

  // Implicit multiplication
  s = s.replace(/(\d)\s*\(/g,'$1*(');
  s = s.replace(/\)\s*\(/g,')*(');
  s = s.replace(/\)\s*(\d)/g,')*$1');
  s = s.replace(/(\d)\s+([a-zA-Z](?!ath\.))/g,'$1*$2');

  // FIX: remove any spurious * that got inserted immediately after a Math.xxx function name
  // e.g. Math.log10*(  → Math.log10(
  s = s.replace(/(Math\.\w+)\*\(/g, '$1(');

  return s;
}
</script>

let D;try{
  // Try URL-safe base64 first (new links), fallback to standard base64 (old links)
  const tryDecode=enc=>{const b64=enc.replace(/-/g,'+').replace(/_/g,'/');const pad=b64+'==='.slice(0,(4-b64.length%4)%4);return JSON.parse(decodeURIComponent(atob(pad)));};

const N=10,C=44,PL=52,PB=50,PT=10,PR=10;
const GW=N*C,GH=N*C,SW=PL+GW+PR,SH=PT+GH+PB;
const XRAY=PT+GH+25,YRAY=PL-25;
const TEAL='#0d9488',RED='#ef4444',DARK='#1a1a2e';
const ns='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,String(v));return e;};
const tx=(s,a={})=>{const e=mk('text',a);e.textContent=String(s);return e;};
const g2s=(x,y)=>[PL+x*C,PT+(N-y)*C];
const s2g=(sx,sy)=>[(sx-PL)/C,N-(sy-PT)/C];
const snap=v=>Math.round(Math.max(0,Math.min(10,v)));
const sv=document.getElementById('sv');
sv.setAttribute('viewBox',`0 0 ${SW} ${SH}`);

// ── State ──────────────────────────────────────────────────────────
// Point-axis sliders
const sl={};
D.points.forEach(p=>{if(p.type==='moveable'){if(p.xSlider)sl[p.id+'_x']=p.x;if(p.ySlider)sl[p.id+'_y']=p.y;}});

// Point position overrides from edge sliders (keyed by point id)
const ptOverride={};

// Current position of any point (checks override first, then axis sliders)
const getPos=p=>{
  if(ptOverride[p.id])return ptOverride[p.id];
  if(p.type==='fixed')return{x:p.x,y:p.y};
  return{x:sl[p.id+'_x']??p.x,y:sl[p.id+'_y']??p.y};
};

// ── Variable computation ───────────────────────────────────────────
const getVars=()=>{
  const v={};
  (D.points||[]).forEach((p,i)=>{try{const r=getPos(p);v[`x_${i+1}`]=Math.round(r.x*100)/100;v[`y_${i+1}`]=Math.round(r.y*100)/100;}catch(e){}});
  // Pair distances — find points first, then call getPos safely
  (D.pairs||[]).forEach(pair=>{
    const pt1=D.points.find(p=>p.id===pair.p1),pt2=D.points.find(p=>p.id===pair.p2);
    if(pt1&&pt2){try{const a=getPos(pt1),b=getPos(pt2);v[pair.name]=Math.round(Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)*100)/100;}catch(e){}}
  });
    let aIdx=1;
  (D.angles||[]).forEach(ang=>{
    const pp1=D.points.find(p=>p.id===ang.p1),pv=D.points.find(p=>p.id===ang.vertex),pp2=D.points.find(p=>p.id===ang.p2);
    if(pp1&&pv&&pp2){
      const a=getPos(pp1),cv=getPos(pv),b=getPos(pp2);
      const dx1=a.x-cv.x,dy1=a.y-cv.y,dx2=b.x-cv.x,dy2=b.y-cv.y;
      const dot=dx1*dx2+dy1*dy2,mag=Math.sqrt(dx1**2+dy1**2)*Math.sqrt(dx2**2+dy2**2);
      const nr=mag>1e-9?Math.round(Math.acos(Math.max(-1,Math.min(1,dot/mag)))*1800/Math.PI)/10:0;
      if(ang.reflex==='reflex'){
        v[`A_${aIdx}`]=Math.round((360-nr)*10)/10;aIdx++;
      }else if(ang.reflex==='both'){
        const a1g=Math.atan2(dy1,dx1),a2g=Math.atan2(dy2,dx2);
        let dirCCW=a2g-a1g;
        while(dirCCW<0)dirCCW+=2*Math.PI;
        while(dirCCW>=2*Math.PI)dirCCW-=2*Math.PI;
        const A_dir=Math.round(dirCCW*1800/Math.PI)/10;
        v[`A_${aIdx}`]=A_dir;v[`A_${aIdx+1}`]=Math.round((3600-dirCCW*1800/Math.PI))/10;

      }else{
        const a1g=Math.atan2(dy1,dx1),a2g=Math.atan2(dy2,dx2);
        let dirCCW=a2g-a1g;
        while(dirCCW<0)dirCCW+=2*Math.PI;
        while(dirCCW>=2*Math.PI)dirCCW-=2*Math.PI;
        v[`A_${aIdx}`]=Math.round(dirCCW*1800/Math.PI)/10;
        aIdx++;
      }
    } else{aIdx+=(ang.reflex==='both'?2:1);}
  });
  return v;
};

const getClosedPolyPts=()=>{
  if(!D.edges.length)return'';
  const adj={};
  D.edges.forEach(e=>{
    if(!adj[e.p1])adj[e.p1]=[];
    if(!adj[e.p2])adj[e.p2]=[];
    if(!adj[e.p1].includes(e.p2))adj[e.p1].push(e.p2);
    if(!adj[e.p2].includes(e.p1))adj[e.p2].push(e.p1);
  });
  const ids=Object.keys(adj).map(Number);
  if(ids.length<3||!ids.every(id=>adj[id].length===2))return'';

  const start=ids[0],ordered=[start];
  let prev=null,cur=start;
  for(let i=1;i<ids.length;i++){
    const nxt=adj[cur].find(n=>n!==prev);
    if(nxt===undefined||nxt===start)break;
    ordered.push(nxt);prev=cur;cur=nxt;
  }
  if(ordered.length!==ids.length)return'';
  return ordered.map(id=>{const p=D.points.find(pt=>pt.id===id);if(!p)return'0,0';const r=getPos(p);const[x,y]=g2s(r.x,r.y);return x+','+y;}).join(' ');
};

    const sh=mk('g',{style:pillActive?'cursor:grab':'cursor:not-allowed'});
    sh.appendChild(mk('ellipse',{rx:18,ry:10,fill:pillFill,'fill-opacity':pillActive?1:0.8,stroke:DARK,'stroke-width':2.5}));
    sh.appendChild(tx(pillActive?'⟺':'⊘',{x:0,y:4,'text-anchor':'middle','font-size':13,fill:'#fff','font-weight':'700'}));
    // Direction arrow for one-sided sliders
    if(pillActive&&sDir!=='both'){
      sh.appendChild(tx(sDir==='p2'?'→':'←',{x:0,y:-13,'text-anchor':'middle','font-size':9,fill:pillFill}));
    }
    g.appendChild(sh);
    edgeEls[e.id].slider=pillActive?sh:null; // only register as draggable if active
    // Ghost elements
    const gg=mk('g',{opacity:0,style:'pointer-events:none'});
    gg.appendChild(mk('line',{stroke:TEAL,'stroke-width':2.5,'stroke-dasharray':'6,4'}));
    gg.appendChild(mk('circle',{r:10,fill:TEAL,stroke:DARK,'stroke-width':2,opacity:.55}));
    root.appendChild(gg);
    ghostEls[e.id]={group:gg,line:gg.children[0],pt:gg.children[1]};
  }
  edgeLayer.appendChild(g);
});

// Guide lines (point → axis slider)
const guideEls={};
D.points.filter(p=>p.type==='moveable'&&!p.hidden).forEach(p=>{
  if(p.xSlider){const l=mk('line',{stroke:TEAL,'stroke-width':1.5,'stroke-dasharray':'5,4'});root.appendChild(l);guideEls[p.id+'_x']=l;}
  if(p.ySlider){const l=mk('line',{stroke:TEAL,'stroke-width':1.5,'stroke-dasharray':'5,4'});root.appendChild(l);guideEls[p.id+'_y']=l;}
});

// Axis slider handles
const slEls={};
D.points.filter(p=>p.type==='moveable').forEach(p=>{
  if(p.xSlider){
    const g=mk('g',{style:'cursor:ew-resize'});
    const rx=mk('rect',{x:-16,y:-11,width:32,height:22,rx:11,fill:TEAL,stroke:DARK,'stroke-width':2.5});
    g.appendChild(rx);g.appendChild(tx('⇔',{x:0,y:5,'text-anchor':'middle','font-size':13,fill:'#fff'}));
    root.appendChild(g);slEls[p.id+'_x']={el:g,rect:rx,axis:'x',pid:p.id};
  }
  if(p.ySlider){
    const g=mk('g',{style:'cursor:ns-resize'});
    const ry=mk('rect',{x:-11,y:-16,width:22,height:32,rx:11,fill:TEAL,stroke:DARK,'stroke-width':2.5});
    g.appendChild(ry);g.appendChild(tx('⇕',{x:0,y:6,'text-anchor':'middle','font-size':13,fill:'#fff'}));
    root.appendChild(g);slEls[p.id+'_y']={el:g,rect:ry,axis:'y',pid:p.id};
  }
});
// ── Active-point highlight ring ──────────────────────────────────────
const highlightEl=mk('circle',{r:14,fill:'none',stroke:'#fbbf24','stroke-width':3.5,opacity:0,style:'pointer-events:none'});
root.appendChild(highlightEl);

// ── Audio (Web Audio API, lazy init) ─────────────────────────────────
let _ac=null;
const ac=()=>{if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;};
const playTick=(f=500)=>{try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='triangle';o.frequency.value=f;const t=c.currentTime;g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);o.start(t);o.stop(t+0.08);}catch(e){}};
const playSuccess=()=>{try{const c=ac();[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;const t=c.currentTime+i*.13;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}catch(e){}};
const playError=()=>{try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(260,c.currentTime);o.frequency.exponentialRampToValueAtTime(80,c.currentTime+.35);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start(c.currentTime);o.stop(c.currentTime+.35);}catch(e){}};
const ptGlowEls={};


// Point circles — hidden points exist in ptEls but not in DOM
const ptEls={};
D.points.forEach(p=>{
  const g=mk('g');
  if(p.type==='moveable'&&!p.hidden){
    const gl=mk('circle',{r:15,fill:'#99f6e4','class':'pt-glow'});
    g.appendChild(gl);ptGlowEls[p.id]=gl;
  }
  if(!p.hidden)g.appendChild(mk('circle',{r:10,fill:p.type==='fixed'?RED:TEAL,stroke:DARK,'stroke-width':2.5}));
  if(!p.hidden)root.appendChild(g);
  ptEls[p.id]=g;
});

// ── Draw ─────────────────────────────────────────────────────────
function draw(){
  // Edges — endpoints computed from getPos (which includes ptOverride)
  D.edges.forEach(e=>{
    const p1=D.points.find(p=>p.id===e.p1),p2=D.points.find(p=>p.id===e.p2);
    if(!p1||!p2)return;
    const ep1=getPos(p1),ep2=getPos(p2);
    const[x1,y1]=g2s(ep1.x,ep1.y),[x2,y2]=g2s(ep2.x,ep2.y);
    const l=edgeEls[e.id].line;
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    if(e.isMovable&&edgeEls[e.id].slider){
      const mx=(x1+x2)/2,my=(y1+y2)/2;
      const angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
      edgeEls[e.id].slider.setAttribute('transform',`translate(${mx},${my}) rotate(${angle})`);
    }
  });
  // Points
  D.points.forEach(p=>{const r=getPos(p);const[px,py]=g2s(r.x,r.y);ptEls[p.id].setAttribute('transform',`translate(${px},${py})`);});
  // Axis sliders + guides
  D.points.filter(p=>p.type==='moveable').forEach(p=>{
    const r=getPos(p);const[px,py]=g2s(r.x,r.y);
    if(p.xSlider){
      const sx=PL+r.x*C;
      slEls[p.id+'_x'].el.setAttribute('transform',`translate(${sx},${XRAY})`);
      const g=guideEls[p.id+'_x'];if(g){g.setAttribute('x1',sx);g.setAttribute('y1',XRAY-12);g.setAttribute('x2',px);g.setAttribute('y2',py);}
    }
    if(p.ySlider){
      slEls[p.id+'_y'].el.setAttribute('transform',`translate(${YRAY},${py})`);
      const g=guideEls[p.id+'_y'];if(g){g.setAttribute('x1',YRAY+12);g.setAttribute('y1',py);g.setAttribute('x2',px);g.setAttribute('y2',py);}
    }
  });
  // Active-point highlight ring: keep it on the locked endpoint during edge drag
  if(edgeDrag&&edgeDrag.lockedPtId){
    const ap=D.points.find(p=>p.id===edgeDrag.lockedPtId);
    if(ap){const pos=getPos(ap);const[hx,hy]=g2s(pos.x,pos.y);highlightEl.setAttribute('cx',hx);highlightEl.setAttribute('cy',hy);}
  }
  // Slider brightness + point glow when axis-dragging
  const BRIGHT='#14b8a6';
  D.points.filter(p=>p.type==='moveable').forEach(p=>{
    const isAct=ptDrag&&ptDrag.pid===p.id;
    if(slEls[p.id+'_x']?.rect) slEls[p.id+'_x'].rect.setAttribute('fill',isAct&&ptDrag.axis==='x'?BRIGHT:TEAL);
    if(slEls[p.id+'_y']?.rect) slEls[p.id+'_y'].rect.setAttribute('fill',isAct&&ptDrag.axis==='y'?BRIGHT:TEAL);
    if(ptGlowEls[p.id]) ptGlowEls[p.id].className.baseVal=isAct?'pt-glow active':'pt-glow';
  });
  // Fill — only for closed polygons
  fillEl.setAttribute('points',getClosedPolyPts());
}

// ── Drag state + undo history ────────────────────────────────────────────
let ptDrag=null,edgeDrag=null,ghostState={active:false};
let lastValidGhost=null;
let moveHistory=[]; // undo stack — each entry is {sl:{...}, ptOverride:{...}}
const snapshot=()=>({sl:JSON.parse(JSON.stringify(sl)),ptOverride:JSON.parse(JSON.stringify(ptOverride))});
const undoMove=()=>{if(!moveHistory.length)return;const s=moveHistory.pop();Object.keys(sl).forEach(k=>delete sl[k]);Object.assign(sl,s.sl);Object.keys(ptOverride).forEach(k=>delete ptOverride[k]);Object.assign(ptOverride,s.ptOverride);draw();updateUndoBtn();};
const updateUndoBtn=()=>{const btn=document.getElementById('undoBtn');if(btn)btn.disabled=moveHistory.length===0;};

// ── Axis slider drag ──────────────────────────────────────────────
// When a point has a ptOverride (from edge slider), sync it into sl so
// axis sliders continue to work correctly.
const slOrder={};
Object.values(slEls).forEach(({el,axis,pid})=>{
  const onD=e=>{
    e.preventDefault();
    moveHistory.push(snapshot()); updateUndoBtn();
    if(ptOverride[pid]){
      sl[pid+'_x']=ptOverride[pid].x;
      sl[pid+'_y']=ptOverride[pid].y;
      delete ptOverride[pid];
    }
    const sameAxis=D.points.filter(p=>p.type==='moveable'&&(axis==='x'?p.xSlider:p.ySlider));
    slOrder[pid+'_'+axis]=sameAxis.sort((a,b)=>{
      const va=sl[a.id+'_'+axis]??0,vb=sl[b.id+'_'+axis]??0;
      if(va!==vb)return va-vb;
      // Equal current values: use INITIAL point position as permanent tiebreaker
      // P with lower initial position is forever "lower" in ordering — preserves retreat direction
      const ia=axis==='x'?a.x:a.y, ib=axis==='x'?b.x:b.y;
      if(ia!==ib)return ia-ib;
      return D.points.indexOf(a)-D.points.indexOf(b);
    }).map(p=>p.id);
    ptDrag={key:pid+'_'+axis,axis,pid,order:slOrder[pid+'_'+axis]};
    // Bring to front so overlapping sliders pick the last-used one
    if(el.parentNode) el.parentNode.appendChild(el);
  };
  el.addEventListener('mousedown',onD);el.addEventListener('touchstart',onD,{passive:false});
});

// ── Edge slider drag ──────────────────────────────────────────────
D.edges.filter(e=>e.isMovable).forEach(e=>{
  const sh=edgeEls[e.id].slider;if(!sh)return;
  const onD=ev=>{
    ev.preventDefault();ev.stopPropagation();
    moveHistory.push(snapshot()); updateUndoBtn();
    const t=ev.touches?ev.touches[0]:ev;
    const sDir=e.slideDir||'both';
    // Pre-lock endpoint if slideDir forces a specific side; else wait for first movement
    const preLock=sDir==='p1'?e.p1:sDir==='p2'?e.p2:null;
    edgeDrag={edgeId:e.id,lockedPtId:preLock,locked:preLock!==null,startCX:t.clientX,startCY:t.clientY};
    ghostState={active:false};lastValidGhost=null;
    if(ghostEls[e.id])ghostEls[e.id].group.setAttribute('opacity',0);
    if(preLock){
      const ap=D.points.find(p=>p.id===preLock);
      if(ap){const[hx,hy]=g2s(getPos(ap).x,getPos(ap).y);highlightEl.setAttribute('cx',hx);highlightEl.setAttribute('cy',hy);highlightEl.setAttribute('opacity',1);}
    }
  };
  sh.addEventListener('mousedown',onD);sh.addEventListener('touchstart',onD,{passive:false});
});

// ── Global move/up ────────────────────────────────────────────────
const cPos=ev=>{const t=ev.touches?ev.touches[0]:ev;return{cx:t.clientX,cy:t.clientY};};
const onMove=ev=>{
  ev.preventDefault&&ev.preventDefault();
  const{cx,cy}=cPos(ev);
  const rect=sv.getBoundingClientRect();
  const sx=(cx-rect.left)/rect.width*SW,sy=(cy-rect.top)/rect.height*SH;

  // ── Axis slider ───────────────────────────────────────────────
  if(ptDrag){
    let v=ptDrag.axis==='x'?snap((sx-PL)/C):snap(N-(sy-PT)/C);
    const{order,pid,axis}=ptDrag;
    if(order&&order.length>1){
      const idx=order.indexOf(pid);
      const lo=idx>0?(sl[order[idx-1]+'_'+axis]??0):0;
      const hi=idx<order.length-1?(sl[order[idx+1]+'_'+axis]??10):10;
      v=Math.max(lo,Math.min(hi,v));
    }
    const prevV=sl[ptDrag.key]; sl[ptDrag.key]=v; if(prevV!==v) playTick(280+v*28); draw();return;
  }

  // ── Edge slider — integer-only, slope-preserving ─────────────
  if(edgeDrag){
    const e=D.edges.find(e=>e.id===edgeDrag.edgeId);if(!e)return;
    const p1=D.points.find(p=>p.id===e.p1),p2=D.points.find(p=>p.id===e.p2);if(!p1||!p2)return;
    const ep1=getPos(p1),ep2=getPos(p2);
    // Compute slope from CURRENT positions — reflects axis-slider and edge-slider moves
    const dxCur=Math.round(ep2.x-ep1.x),dyCur=Math.round(ep2.y-ep1.y);
    if(dxCur===0&&dyCur===0)return;
    const gv=gcd(Math.abs(dxCur),Math.abs(dyCur));
    const dsx=dxCur/gv,dsy=dyCur/gv,stepSq=dsx*dsx+dsy*dsy;
    const ox=ep1.x,oy=ep1.y; // anchor = current P1
    const[gx,gy]=s2g(sx,sy);
    // Perpendicular check: distance from cursor to slope line through CURRENT midpoint
    const mx=(ep1.x+ep2.x)/2,my=(ep1.y+ep2.y)/2;
    const projM=(gx-mx)*dsx+(gy-my)*dsy;
    const perpX=(gx-mx)-projM*dsx/stepSq,perpY=(gy-my)-projM*dsy/stepSq;
    const perp=Math.sqrt(perpX*perpX+perpY*perpY);
    const ge=ghostEls[e.id];
    if(perp>1.8){return;} // freeze last valid ghost when cursor drifts
    // Project cursor from CURRENT P1 (ox,oy) — k=0 is P1, k=gv is P2
    const projFromOrig=(gx-ox)*dsx+(gy-oy)*dsy;
    const k=Math.round(projFromOrig/stepSq);
    const k1cur=0,k2cur=gv; // P1 is anchor (k=0); P2 is always at k=gv by construction
    // First-movement locking: on first drag, lock to whichever endpoint the movement targets
    if(!edgeDrag.locked){
      const rect=sv.getBoundingClientRect();
      const dGX=(cx-edgeDrag.startCX)/rect.width*GW;
      const dGY=-(cy-edgeDrag.startCY)/rect.height*GH;
      const proj=dGX*dsx+dGY*dsy; // project screen delta onto edge direction
      if(Math.abs(proj)<0.3){return;} // not enough movement yet
      edgeDrag.lockedPtId=proj>0?e.p2:e.p1;
      edgeDrag.locked=true;
      const ap=D.points.find(p=>p.id===edgeDrag.lockedPtId);
      if(ap){const pos=getPos(ap);const[hx,hy]=g2s(pos.x,pos.y);highlightEl.setAttribute('cx',hx);highlightEl.setAttribute('cy',hy);highlightEl.setAttribute('opacity',1);}
    }
    const freePtId=edgeDrag.lockedPtId;
    // Ghost always at integer (ox+k*dsx: all integers)
    const ghostX=ox+k*dsx, ghostY=oy+k*dsy;
    const samePos=freePtId===e.p2?(k===k2cur):(k===k1cur);
    // Fix A: ghost line goes from CURRENT FREE ENDPOINT to ghost (not from anchor)
    const freeX=freePtId===e.p2?ep2.x:ep1.x, freeY=freePtId===e.p2?ep2.y:ep1.y;
    if(!edgeDrag.lastK||edgeDrag.lastK!==k){playTick(340+k*20);edgeDrag.lastK=k;}
    ghostState={active:true,ghostX,ghostY,freePtId};
    lastValidGhost={ghostX,ghostY,freePtId}; // Fix B: always save last valid ghost
    if(ge){
      const[fgx,fgy]=g2s(freeX,freeY),[ggx,ggy]=g2s(ghostX,ghostY);
      ge.line.setAttribute('x1',fgx);ge.line.setAttribute('y1',fgy);
      ge.line.setAttribute('x2',ggx);ge.line.setAttribute('y2',ggy);
      ge.pt.setAttribute('cx',ggx);ge.pt.setAttribute('cy',ggy);
      ge.group.setAttribute('opacity',1);
    }
  }
};
const onUp=()=>{
  if(ptDrag){ptDrag=null;return;}
  if(edgeDrag){
    highlightEl.setAttribute('opacity',0); // hide highlight
    // Fix B: commit lastValidGhost if any (handles case where perp > 1.8 at moment of release)
    const commit=lastValidGhost;
    if(commit){
      ptOverride[commit.freePtId]={x:commit.ghostX,y:commit.ghostY};
      const ge=ghostEls[edgeDrag.edgeId];
      if(ge)ge.group.setAttribute('opacity',0);
      ghostState={active:false};
      lastValidGhost=null;
      draw();
    }
    edgeDrag=null;
  }
};
window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
window.addEventListener('touchmove',onMove,{passive:false});window.addEventListener('touchend',onUp);

// ── Question & submit ─────────────────────────────────────────────
document.getElementById('q').textContent=D.prompt||'';
const evalCustom=(formula,vars)=>{
  // Find comparison operator — check multi-char ops first to avoid partial matches
  const _ops=[['>=', (a,b)=>a>=b-0.05],['<=', (a,b)=>a<=b+0.05],
              ['!=', (a,b)=>Math.abs(a-b)>0.05],['\u2260',(a,b)=>Math.abs(a-b)>0.05],
              ['\u2265',(a,b)=>a>=b-0.05],['\u2264',(a,b)=>a<=b+0.05],
              ['>', (a,b)=>a>b],['<', (a,b)=>a<b],
              ['=', (a,b)=>Math.abs(a-b)<=0.05]];
  let _op=null,_ei=-1,_olen=1;
  for(const [sym,fn] of _ops){const idx=formula.indexOf(sym);if(idx>=0){_op=fn;_ei=idx;_olen=sym.length;break;}}
  if(_ei<0)return false;
  const evalS=s=>{
    let e=latexToJS(s.trim());
    const keys=Object.keys(vars).sort((a,b)=>b.length-a.length);
    keys.forEach(k=>{e=e.split(k).join(String(vars[k]));});
    e=e.replace(/(\d)\s*\(/g,'$1*(').replace(/\)\s*\(/g,')*(').replace(/\)\s*(\d)/g,')*$1');
    e=e.replace(/\^(?!\*)/g,'**');
    try{return Function('"use strict";return('+e+')')();}catch(err){return NaN;}
  };
  const lv=evalS(formula.slice(0,_ei)),rv=evalS(formula.slice(_ei+_olen));
  return!isNaN(lv)&&!isNaN(rv)&&_op(lv,rv);
};
const evalC=(c,vars)=>{
  if(c.type==='custom')return evalCustom(c.formula||'',vars);
  try{
    const lhs=+(vars[c.varName]??0),rhs=c.rhsType==='var'?+(vars[c.rhs]??0):+c.rhs,rhs2=+(c.rhs2||0);
    if(c.op==='=')return Math.abs(lhs-rhs)<=0.05;if(c.op==='\u2260')return Math.abs(lhs-rhs)>0.05;
    if(c.op==='<')return lhs<rhs;if(c.op==='>')return lhs>rhs;
    if(c.op==='\u2264')return lhs<=rhs;if(c.op==='\u2265')return lhs>=rhs;
    if(c.op==='between')return lhs>=Math.min(rhs,rhs2)&&lhs<=Math.max(rhs,rhs2);
  }catch(e){}return false;
};
document.getElementById('undoBtn').onclick=undoMove;
document.getElementById('sub').onclick=()=>{
  const res=document.getElementById('res');
  try{
    const vars=getVars();
    const conds=D.conds||[];
    const items=conds.filter(c=>c.type==='cond'||c.type==='custom'),conns=conds.filter(c=>c.type==='conn');
    if(!items.length){res.style.display='block';res.className='no';res.textContent='No win conditions set.';return;}
    const results=items.map((c,i)=>({...c,letter:String.fromCharCode(65+i),passed:evalC(c,vars)}));
    let ok;
    if(D.condExpr&&D.condExpr.trim()){
      // New: expression-based evaluation
      let e=(D.condExpr||'').trim().toUpperCase();
      const map={};results.forEach(r=>{map[r.letter]=r.passed;});
      Object.entries(map).forEach(([k,v])=>{e=e.replace(new RegExp('\\b'+k+'\\b','g'),v?'true':'false');});
      e=e.replace(/\bAND\b/g,'&&').replace(/\bOR\b/g,'||').replace(/\bNOT\b/g,'!');
      try{ok=Boolean(Function('"use strict";return('+e+')')());}catch(err){ok=false;}
    }else{
      // Backward compat: linear connector evaluation
      ok=results[0].passed;
      for(let i=1;i<results.length;i++){const lg=conns[i-1]?.logical??'AND';ok=lg==='AND'?ok&&results[i].passed:ok||results[i].passed;}
    }
    res.style.display='block';
    if(ok){res.className='ok';res.textContent='✅  Nailed it! Great work!';try{playSuccess();}catch(e){}}
    else{res.className='no';res.textContent='❌  Not quite — try again!';try{playError();}catch(e){}}
  }catch(err){
    res.style.display='block';res.className='no';
    res.textContent='⚠️ Error: '+(err&&err.message?err.message:'unknown error')+'. Please try again.';
    console.error('Submit error:',err);
  }
};
draw();
})();
</script>
