<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lever — Fulcrum Lab</title>
<style>
  :root{--ink:#22315B;--soft:#5A6685;--orange:#FF6B35;--green:#1FA06B;--line:#E4E8F2;--bg:#FFFDF9;--panel:#F5F7FC}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column}
  #stage{flex:1;position:relative}
  canvas{display:block;width:100%;height:100%;cursor:ew-resize;touch-action:none}
  #hint{position:absolute;left:12px;top:12px;background:rgba(255,253,249,.92);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:600;color:var(--soft);max-width:230px}
  #hint b{color:var(--ink)}
  #ctrl{padding:10px 14px;background:#fff;border-top:1.5px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #ctrl label{font-size:12px;font-weight:700;color:var(--soft)}
  input[type=range]{accent-color:var(--green);flex:1;min-width:120px}
  button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--ink);color:#fff}
  button.sec{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
  #fTag{font-weight:800;color:var(--green);min-width:130px;text-align:right;font-size:12px}
</style></head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas>
    <div id="hint">Drag left ↔ right (or use the slider) to move the <b>fulcrum</b>, then drop the weight to <b>launch</b> the ball. Fulcrum closer to the rock = easier lift.</div>
  </div>
  <div id="ctrl">
    <label>Fulcrum position</label>
    <input type="range" id="ful" min="20" max="80" value="50">
    <span id="fTag">centred</span>
    <button id="drop">▶ Drop weight</button>
    <button class="sec" id="reset">Reset</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const C=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:C,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xFFFDF9);
const cam=new THREE.PerspectiveCamera(44,1,0.1,100); cam.position.set(0,3.2,9.5); cam.lookAt(0,1.1,0);
scene.add(new THREE.AmbientLight(0xffffff,.85));
const dl=new THREE.DirectionalLight(0xffffff,.6); dl.position.set(3,8,5); scene.add(dl);
const ground=new THREE.Mesh(new THREE.BoxGeometry(16,.4,6),new THREE.MeshLambertMaterial({color:0xE4E8F2})); ground.position.y=-.2; scene.add(ground);
const fulMat=new THREE.MeshLambertMaterial({color:0x22315B});
const fulcrum=new THREE.Mesh(new THREE.ConeGeometry(.85,1.3,3),fulMat); fulcrum.position.set(0,.55,0); fulcrum.rotation.y=Math.PI/2; scene.add(fulcrum);
const beamLen=8, beam=new THREE.Mesh(new THREE.BoxGeometry(beamLen,.28,1.1),new THREE.MeshLambertMaterial({color:0xFF6B35}));
const beamGrp=new THREE.Group(); beamGrp.position.set(0,1.2,0); beam.position.x=0; beamGrp.add(beam); scene.add(beamGrp);
const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.62),new THREE.MeshStandardMaterial({color:0x5A6685,roughness:.9}));
const ball=new THREE.Mesh(new THREE.SphereGeometry(.42,24,18),new THREE.MeshStandardMaterial({color:0x1FA06B,roughness:.4}));
scene.add(rock,ball);
const weight=new THREE.Mesh(new THREE.BoxGeometry(.8,.8,.8),new THREE.MeshStandardMaterial({color:0x22315B}));
scene.add(weight);
let fval=50, fpos=0, tilt=0, launching=false, flyT=0, ballFly=null;
function endWorld(localX){ const v=new THREE.Vector3(localX-fpos,0,0);
  v.applyAxisAngle(new THREE.Vector3(0,0,1),tilt); v.add(new THREE.Vector3(fpos,1.2,0)); return v; }
function placeEnds(){ const L=endWorld(-beamLen/2), R=endWorld(beamLen/2);
  rock.position.set(L.x,L.y+.5,0); if(!launching){ball.position.set(R.x,R.y+.45,0);} weight.position.set(R.x,R.y+3.2,0); }
function layout(){ fulcrum.position.x=fpos; beamGrp.position.x=fpos; beam.position.x=-fpos; beamGrp.rotation.z=tilt; placeEnds(); }
function setFul(v){ fval=Math.max(20,Math.min(80,v)); fpos=(fval-50)/30*2.6;
  document.getElementById('fTag').textContent = fval<42?'near the rock (easy lift)':fval>58?'far from rock (hard lift)':'centred';
  document.getElementById('ful').value=Math.round(fval); layout(); }
setFul(50);
function dropWeight(){ if(launching)return; launching=true; flyT=0;
  const adv=THREE.MathUtils.clamp((-fpos+2.6)/5.2,0,1); ballFly={v:4+adv*7,x0:0,y0:0}; }
function resetAll(){ launching=false; tilt=0; flyT=0; ballFly=null; layout(); }
document.getElementById('ful').oninput=e=>{ if(!launching)setFul(+e.target.value); };
document.getElementById('reset').onclick=resetAll;
document.getElementById('drop').onclick=dropWeight;
// DRAG horizontally to move the fulcrum
let dragging=false,dx0=0,f0=0;
C.addEventListener('pointerdown',e=>{ if(launching)return; dragging=true; dx0=e.clientX; f0=fval; try{C.setPointerCapture(e.pointerId);}catch(_){}});
C.addEventListener('pointermove',e=>{ if(!dragging)return; setFul(f0+(e.clientX-dx0)*0.12); });
function endDrag(){ dragging=false; }
C.addEventListener('pointerup',endDrag); C.addEventListener('pointercancel',endDrag); C.addEventListener('pointerleave',endDrag);
let last=performance.now();
function loop(now){ const dt=(now-last)/1000; last=now;
  if(launching){ flyT+=dt; tilt=Math.max(-.32,-flyT*0.9); layout();
    if(flyT>0.35 && ballFly){ if(ballFly.x0===0){const R=endWorld(beamLen/2);ballFly.x0=R.x;ballFly.y0=R.y+.45;ballFly.tt=0;}
      ballFly.tt+=dt; const vx=ballFly.v*0.45, vy=ballFly.v*0.9;
      ball.position.x=ballFly.x0+vx*ballFly.tt; ball.position.y=ballFly.y0+vy*ballFly.tt-4.9*ballFly.tt*ballFly.tt;
      if(ball.position.y<-.2){launching=false;} } }
  renderer.render(scene,cam); requestAnimationFrame(loop); }
function resize(){const w=C.clientWidth,h=C.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(C); resize(); requestAnimationFrame(loop);

/* ===== live-sync contract ===== */
let _bcast=true;
function getState(){ var f=+fval; if(!isFinite(f))f=50;
  return { ful:Math.round(f), phase:launching?'launch':(flyT>0?'done':'idle') }; }
function setState(s){ if(!s)return; _bcast=false;
  try{ if(s.phase==='idle' && (launching||flyT>0)) resetAll();
    if(typeof s.ful==='number'&&isFinite(s.ful)&&!launching) setFul(s.ful);
    if(s.phase==='launch' && !launching && flyT===0) dropWeight();
  }finally{ _bcast=true; } }
window.addEventListener('message',function(e){ var d=e.data||{};
  if(d.type==='getState'){ try{parent.postMessage({type:'state',data:getState()},'*');}catch(_){} }
  else if(d.type==='setState'){ setState(d.data); } });
(function(){ if(window.__liveSyncEmit)return; var _t=0,_p=null;
  function _send(){ try{ if(typeof getState!=='function')return; parent.postMessage({type:'state',data:getState()},'*'); }catch(_){} }
  window.__liveSyncEmit=function(){ var n=Date.now(); if(n-_t>110){_t=n;_send();} else {clearTimeout(_p);_p=setTimeout(function(){_t=Date.now();_send();},110);} };
  ['pointerdown','pointermove','pointerup','click','input','change','wheel','keydown','keyup','touchmove','touchend']
    .forEach(function(ev){ document.addEventListener(ev,function(){setTimeout(window.__liveSyncEmit,0);},true); });
})();
</script></body></html>
