<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Transfer Visualizer</title>
<style>
  :root{--ink:#22315B;--soft:#5A6685;--orange:#FF6B35;--green:#1FA06B;--amber:#EFA320;--line:#E4E8F2;--bg:#FFFDF9;--panel:#F5F7FC}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column}
  #stage{flex:1;position:relative}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  #tag{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px;font-family:'Baloo 2','Inter',sans-serif;white-space:nowrap;transition:background .25s}
  #ctrl{padding:10px 14px;background:#fff;border-top:1.5px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
  #ctrl label{font-size:12px;font-weight:700;color:var(--soft)}
  input[type=range]{accent-color:var(--orange);width:130px}
  button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:9px 18px;cursor:pointer;background:var(--ink);color:#fff}
  button.sec{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
  #leg{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;line-height:1.7}
  #leg span{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  #drophint{position:absolute;left:12px;top:12px;background:rgba(34,49,91,.92);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:7px 11px;max-width:150px;line-height:1.4}
</style></head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas>
    <div id="tag">Drag the ball up, then press Play</div>
    <div id="drophint">Drag up / down to set the drop height</div>
    <div id="leg">
      <div><span style="background:#FF6B35"></span>Gravitational PE</div>
      <div><span style="background:#1FA06B"></span>Kinetic energy</div>
      <div><span style="background:#EFA320"></span>Transferred to cart</div>
    </div>
  </div>
  <div id="ctrl">
    <label>Drop height</label>
    <input type="range" id="ht" min="3.2" max="6" step="0.1" value="5">
    <button id="run">▶ Play</button>
    <button class="sec" id="reset">Reset</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const C=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:C,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xFFFDF9);
const cam=new THREE.PerspectiveCamera(43,1,0.1,100); cam.position.set(1.5,3.2,10); cam.lookAt(0.5,1.3,0);
scene.add(new THREE.AmbientLight(0xffffff,.85));
const dl=new THREE.DirectionalLight(0xffffff,.6); dl.position.set(3,9,5); scene.add(dl);
const ground=new THREE.Mesh(new THREE.BoxGeometry(18,.4,6),new THREE.MeshLambertMaterial({color:0xE4E8F2})); ground.position.set(2,-.2,0); scene.add(ground);
const post=new THREE.Mesh(new THREE.BoxGeometry(.3,6,.3),new THREE.MeshLambertMaterial({color:0x5A6685})); post.position.set(-3.4,3,0); scene.add(post);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.45,24,18),new THREE.MeshStandardMaterial({color:0xFF6B35,roughness:.4})); scene.add(ball);
const cart=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.6,.7,1.2),new THREE.MeshStandardMaterial({color:0x22315B})); body.position.y=.75; cart.add(body);
const wheelGeo=new THREE.CylinderGeometry(.34,.34,.18,20); const wheelMat=new THREE.MeshStandardMaterial({color:0x1FA06B});
[[-.55,-.45],[.55,-.45],[-.55,.45],[.55,.45]].forEach(([x,z])=>{const w=new THREE.Mesh(wheelGeo,wheelMat);w.rotation.x=Math.PI/2;w.position.set(x,.34,z);cart.add(w);});
cart.position.set(-2.9,0,0); scene.add(cart);
const tag=document.getElementById('tag');
function setTag(txt,col){tag.textContent=txt;tag.style.background=col;}
let dropH=5, phase='idle', t=0, cartV=0;
function placeBall(){ ball.position.set(-3.4, Math.max(1.05,dropH), 0); }
function setHeight(h){ dropH=Math.max(3.2,Math.min(6,h)); if(phase==='idle')placeBall();
  document.getElementById('ht').value=dropH.toFixed(1); }
setHeight(5);
function play(){ if(phase!=='idle')return; phase='fall'; t=0; ball.material.color.set(0xFF6B35); setTag('At the top: stored Gravitational PE','#FF6B35'); }
function resetAll(){ phase='idle'; t=0; cartV=0; placeBall(); ball.material.color.set(0xFF6B35); cart.position.x=-2.9; setTag('Drag the ball up, then press Play','#22315B'); }
document.getElementById('run').onclick=play;
document.getElementById('reset').onclick=resetAll;
document.getElementById('ht').oninput=e=>{ if(phase==='idle')setHeight(+e.target.value); };
// DRAG to set drop height
let dragging=false,dy0=0,h0=0;
C.addEventListener('pointerdown',e=>{ if(phase!=='idle')return; dragging=true; dy0=e.clientY; h0=dropH; C.classList.add('drag'); try{C.setPointerCapture(e.pointerId);}catch(_){}});
C.addEventListener('pointermove',e=>{ if(!dragging)return; setHeight(h0+(dy0-e.clientY)*0.02); });
function endDrag(){ dragging=false; C.classList.remove('drag'); }
C.addEventListener('pointerup',endDrag); C.addEventListener('pointercancel',endDrag); C.addEventListener('pointerleave',endDrag);
const HITY=1.05;
let last=performance.now();
function loop(now){ const dt=Math.min((now-last)/1000,.05); last=now;
  if(phase==='fall'){ t+=dt; const span=dropH-HITY; const f=Math.min(t*t*3.2/Math.max(span,0.3),1);
    ball.position.y=dropH-(dropH-HITY)*f; ball.position.x=-3.4;
    ball.material.color.setRGB(1-f*0.88,0.42+f*0.2,0.2);
    if(f>0.05)setTag('Falling: PE → Kinetic energy','#1FA06B');
    if(f>=1){phase='transfer';t=0;cartV=2.6+span*0.9;ball.material.color.set(0x1FA06B);setTag('Impact! KE transfers to the cart','#EFA320');}
  } else if(phase==='transfer'){ t+=dt; cart.position.x+=cartV*dt; cartV*=0.985;
    ball.position.x=cart.position.x-1.0; ball.position.y=1.05;
    cart.children.forEach(ch=>{if(ch.geometry&&ch.geometry.type==='CylinderGeometry')ch.rotation.y-=cartV*dt*2;});
    if(cart.position.x>6||cartV<0.4){phase='done';setTag('Cart rolls away — energy moved object to object','#EFA320');}
  }
  renderer.render(scene,cam); requestAnimationFrame(loop); }
function resize(){const w=C.clientWidth,h=C.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(C); resize(); requestAnimationFrame(loop);

/* ===== live-sync contract ===== */
let _bcast=true;
function getState(){ var h=+dropH; if(!isFinite(h))h=5;
  return { h:Math.round(h*10)/10, phase:(phase==='idle')?'idle':(phase==='done'?'done':'play') }; }
function setState(s){ if(!s)return; _bcast=false;
  try{ if(s.phase==='idle' && phase!=='idle') resetAll();
    if(typeof s.h==='number'&&isFinite(s.h)&&phase==='idle') setHeight(s.h);
    if((s.phase==='play'||s.phase==='done') && phase==='idle') play();
  }finally{ _bcast=true; } }
window.addEventListener('message',function(e){ var d=e.data||{};
  if(d.type==='getState'){ try{parent.postMessage({type:'state',data:getState()},'*');}catch(_){} }
  else if(d.type==='setState'){ setState(d.data); } });
(function(){ if(window.__liveSyncEmit)return; var _t=0,_p=null;
  function _send(){ try{ if(typeof getState!=='function')return; parent.postMessage({type:'state',data:getState()},'*'); }catch(_){} }
  window.__liveSyncEmit=function(){ var n=Date.now(); if(n-_t>110){_t=n;_send();} else {clearTimeout(_p);_p=setTimeout(function(){_t=Date.now();_send();},110);} };
  ['pointerdown','pointermove','pointerup','click','input','change','wheel','keydown','keyup','touchmove','touchend']
    .forEach(function(ev){ document.addEventListener(ev,function(){setTimeout(window.__liveSyncEmit,0);},true); });
})();
</script></body></html>
