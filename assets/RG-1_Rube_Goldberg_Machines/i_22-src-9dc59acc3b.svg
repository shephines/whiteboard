<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><rect x="0" y="0" width="100%" height="100%" fill="#FFFDF9"/><text x="320" y="42" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#22315B" text-anchor="middle" >The inclined plane (ramp)</text><polygon points="90,300 540,300 90,150" fill="#F5F7FC" stroke="#22315B" stroke-width="3"/><line x1="90" y1="300" x2="540" y2="300" stroke="#22315B" stroke-width="3"/><circle cx="160" cy="218" r="20" fill="#FF6B35"/><path d="M180 226 L300 280" stroke="#1FA06B" stroke-width="4" marker-end="url(#a2)"/><defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1FA06B"/></marker></defs><text x="120" y="150" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#5A6685" text-anchor="middle" >top</text><text x="360" y="200" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#5A6685" text-anchor="middle" >a gentle slope = an easier climb</text><rect x="150" y="330" width="160" height="34" rx="17" fill="#FF6B35"/><text x="230.0" y="353" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >moves things up or down</text></svg>